# ═══════════════════════════════════════════════════════════════
# 同花亏 · nginx 反向代理（域名 your-domain.com）
#   放到 /etc/nginx/conf.d/your-domain.com.conf 或 sites-available/ 里
#   HTTPS 证书用 certbot 自动申请（见 docs/DEPLOY-LINUX.md 第 4 步）
#
#   要点：
#     1. 服务端只需监听 127.0.0.1:8899，不要直接暴露到公网
#     2. /ws 是 WebSocket 行情长连接，必须带 Upgrade 头 + 关缓冲 + 长读超时
#     3. 静态资源（js/css）加 gzip 与缓存，行情长连接不要缓存
# ═══════════════════════════════════════════════════════════════

# HTTP → HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;

    # certbot 的 http-01 校验目录要放行
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# WebSocket 升级所需的 Connection 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 单条 tick 报文约 20KB（61 只股票），30 人在线时带宽不大，但别让 gzip 压到长连接上
    client_max_body_size 1m;
    access_log /var/log/nginx/tonghuakui.access.log;
    error_log  /var/log/nginx/tonghuakui.error.log;

    # ── WebSocket：行情长连接 ──
    location /ws {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;          # 行情要即时推送，不能攒
        proxy_read_timeout  3600s;    # 一局 15 分钟，留足余量
        proxy_send_timeout  3600s;
        tcp_nodelay on;
    }

    # ── 静态资源（index.html / js / css）──
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        proxy_pass http://127.0.0.1:8899;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        gzip_min_length 1024;
    }

    # ── 其余（index.html、API 回退）──
    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache";
    }
}
